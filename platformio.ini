; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Everything shared lives in [env]; each environment below states only what it
; changes.  Note that an environment's build_flags REPLACE the inherited ones
; rather than adding to them, so the combinations are spelled out in full.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200   ; must match DEBUG_BAUD in the source
build_src_filter = +<*> -<diag/>

; Stamps the build with the commit it came from, for `version` and the
; control page.  Degrades to "unknown" outside a git checkout.
extra_scripts = pre:tools/git_rev.py

; The network stack costs ~535 KB, which the default 1.25 MB app partition
; cannot hold alongside the eye artwork.  min_spiffs gives 1.9 MB and keeps
; both OTA slots.  Used everywhere, including the no-network builds, because
; one partition layout is one less thing to get wrong.
board_build.partitions = min_spiffs.csv

lib_deps =
	adafruit/Adafruit GFX Library@^1.11.3
	adafruit/Adafruit SSD1351 library@^1.2.8
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^7.4.3

; ---------------------------------------------------------------- firmware --

; Colour panels: Waveshare 1.5inch RGB OLED (SSD1351).  The default build.
[env:esp32dev]

; Greyscale panels: Waveshare 1.5inch OLED (SSD1327).
[env:gray]
build_flags = -DUSE_SSD1327=1

; ------------------------------------------------------------ no networking --
;
; No WiFi, no NTP, no web server, no OTA -- nothing on the network at all.
; For anyone who would rather not add another device to it.  Everything else
; works: the eyes, the console over USB, the clock (free-running, set by hand
; with `clock set`), and every eye design.
;
; Saves about 635 KB, taking the firmware from roughly 66% of the partition
; to 34%, which leaves room for several more eye designs.

[env:esp32dev_local]
build_flags = -DNETWORK=0

[env:gray_local]
build_flags = -DUSE_SSD1327=1 -DNETWORK=0

; -------------------------------------------------------------- over the air --
;
;   pio run -e gray_ota -t upload
;
; upload_port is the mDNS name, so it keeps working when DHCP moves the board.
; Two things that bite on Windows:
;
;   - Windows has no mDNS resolver of its own, so frank.local will not resolve
;     unless Bonjour is installed.  macOS and Linux are fine.  Use the address
;     instead:  pio run -e gray_ota -t upload --upload-port 192.168.1.50
;
;   - "No response from device" usually means the host has several network
;     interfaces -- VMware, WSL and VirtualBox each add one -- and espota
;     advertised the wrong one for the device to call back to.  Pin it:
;       upload_flags = --host_ip=192.168.1.20

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = frank.local

[env:gray_ota]
extends = env:gray
upload_protocol = espota
upload_port = frank.local

; ------------------------------------------------------------- diagnostics --

; Drives each panel alone with solid fills, to separate wiring faults from
; rendering faults.  pio run -e displaytest -t upload -t monitor
[env:displaytest]
build_src_filter = -<*> +<diag/display_test.cpp>

; Raw SSD1327 init with no library, to identify an unknown panel.
; pio run -e probe1327 -t upload -t monitor
[env:probe1327]
build_src_filter = -<*> +<diag/ssd1327_probe.cpp>
