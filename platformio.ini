; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; The network stack costs ~535 KB; the default 1.25 MB table cannot hold
; it alongside the eye artwork.  min_spiffs keeps both OTA slots.
board_build.partitions = min_spiffs.csv
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200   ; must match DEBUG_BAUD in src/main.cpp
build_src_filter = +<*> -<diag/>
lib_deps = 
	adafruit/Adafruit GFX Library@^1.11.3
	adafruit/Adafruit SSD1351 library@^1.2.8
	tzapu/WiFiManager@^2.0.17

; Display bring-up diagnostic -- builds src/diag/display_test.cpp instead of
; the eyes firmware.  pio run -e displaytest -t upload -t monitor
[env:displaytest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<diag/display_test.cpp>
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.3
	adafruit/Adafruit SSD1351 library@^1.2.8
	tzapu/WiFiManager@^2.0.17

; Controller ID probe -- raw SSD1327 init, no library.
; pio run -e probe1327 -t upload -t monitor
[env:probe1327]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<diag/ssd1327_probe.cpp>

; Grayscale build for the Waveshare 1.5" OLED Module (SSD1327, 16 greys).
; Same firmware, different panel driver -- see USE_SSD1327 in src/main.cpp.
[env:gray]
; The network stack costs ~535 KB; the default 1.25 MB table cannot hold
; it alongside the eye artwork.  min_spiffs keeps both OTA slots.
board_build.partitions = min_spiffs.csv
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<diag/>
build_flags = -DUSE_SSD1327=1
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.3
	adafruit/Adafruit SSD1351 library@^1.2.8
	tzapu/WiFiManager@^2.0.17

; Flash over WiFi instead of the cable -- the point of OTA once the boards are
; sealed inside a head.  Same firmware as the environment each extends.
;
;   pio run -e gray_ota -t upload
;
; upload_port is the mDNS name, so it keeps working when DHCP moves the
; board.  Two things that bite on Windows:
;
;   - Windows has no mDNS resolver of its own, so frank.local will not
;     resolve unless Bonjour is installed.  macOS and Linux are fine.
;     Override with the address instead:
;       pio run -e gray_ota -t upload --upload-port 192.168.1.50
;
;   - "No response from device" usually means the host has several
;     network interfaces -- VMware, WSL and VirtualBox each add one --
;     and espota advertised the wrong one for the device to call back
;     to.  Pin the right one:
;       upload_flags = --host_ip=192.168.1.20
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = frank.local

[env:gray_ota]
extends = env:gray
upload_protocol = espota
upload_port = frank.local
