; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; The network stack costs ~535 KB; the default 1.25 MB table cannot hold
; it alongside the eye artwork.  min_spiffs keeps both OTA slots.
board_build.partitions = min_spiffs.csv
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200   ; must match DEBUG_BAUD in src/main.cpp
build_src_filter = +<*> -<diag/>
lib_deps = 
	adafruit/Adafruit GFX Library@^1.11.3
	adafruit/Adafruit SSD1351 library@^1.2.8
	tzapu/WiFiManager@^2.0.17

; Display bring-up diagnostic -- builds src/diag/display_test.cpp instead of
; the eyes firmware.  pio run -e displaytest -t upload -t monitor
[env:displaytest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<diag/display_test.cpp>
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.3
	adafruit/Adafruit SSD1351 library@^1.2.8
	tzapu/WiFiManager@^2.0.17

; Controller ID probe -- raw SSD1327 init, no library.
; pio run -e probe1327 -t upload -t monitor
[env:probe1327]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<diag/ssd1327_probe.cpp>

; Grayscale build for the Waveshare 1.5" OLED Module (SSD1327, 16 greys).
; Same firmware, different panel driver -- see USE_SSD1327 in src/main.cpp.
[env:gray]
; The network stack costs ~535 KB; the default 1.25 MB table cannot hold
; it alongside the eye artwork.  min_spiffs keeps both OTA slots.
board_build.partitions = min_spiffs.csv
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<diag/>
build_flags = -DUSE_SSD1327=1
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.3
	adafruit/Adafruit SSD1351 library@^1.2.8
	tzapu/WiFiManager@^2.0.17
